configs:
  - domain: ''
    hosts:
      - 172.42.0.42
      - 172.42.0.43
      - 127.0.0.1
      - localhost
      - tercen
      - tercen-worker
    config:
      tercen.auth.cookie.domain: 127.0.0.1
      tercen.auth.method: 'basic.auth'
      client:
        name: tercen
        signup: 'true'
        show.worker.admin: 'true'

# ALL 0 # OFF 2000 # FINEST 300 # FINER 400 # FINE 500 # CONFIG 700 # INFO 800 # WARNING 900 # SEVERE 1000 # SHOUT 1200
tercen.log.level: '700'

tercen.client.uri: http://172.42.0.42:5400

# development convenience: allow installing/running any operator image / git repo
tercen.allow.untrusted.docker: 'true'
tercen.allow.untrusted.git: 'true'

# accept only image names starting with these prefixes when the above is 'false'
#tercen.trusted.docker:
#  - 'tercen'
#  - 'ghcr.io/tercen/'
#  - 'ghcr.io/pamgene/'
#tercen.trusted.git:
#  - 'https://github.com/tercen/'
#  - 'https://github.com/pamgene/'

# worker pool definition (required for task cpu/memory booking since 0.17.60)
tercen.worker.nodepools:
  - name: worker
    memoryPerNode: 8G
    memoryThreshold: 1
    cpusPerNode: 4
    capabilities: []
    minNodes: 1
    maxNodes: 1

# These keys are read inside worker task isolates, which see the config FILE
# but not environment-variable config — keep them here, not (only) in compose
# env (symptom otherwise: GPU capability check dials /var/run/docker.sock).
tercen.docker.socket: '/run/podman/podman.sock'
tercen.podman.has.additional.image.store: 'false'
tercen.gcs.mock: 'true'
tercen.gcs.bucket: 'studio-bucket'
tercen.gcs.mock.dir: '/var/lib/tercen/data/mock-gcs'
