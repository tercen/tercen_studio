# Tercen Studio — a local Tercen development environment.
#
# Architecture (mirrors production):
#   couchdb + redis + scheduler  -> infrastructure
#   tercen                       -> main application (manages its own sarno
#                                   table-engine container via internal podman)
#   tercen-worker                -> task execution; runs operator containers
#                                   via its own internal podman (no dind needed)
#   tercen-studio                -> RStudio for operator development
#
# Optional (start with: docker compose --profile python up -d):
#   code-server                  -> VS Code for Python operator development

networks:
  tercen:
    ipam:
      driver: default
      config:
        - subnet: 172.42.0.0/16

services:

  postgres:
    networks:
      tercen:
        aliases:
          - postgres
    image: postgres:16
    environment:
      - POSTGRES_USER=tercen
      - POSTGRES_PASSWORD=tercen
      - POSTGRES_DB=tercen
    # prod tunings that mattered for #1206 — scaled down for a laptop
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=24MB
      - -c
      - effective_cache_size=1536MB
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tercen -d tercen"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

  couchdb:
    networks:
      tercen:
        aliases:
          - couchdb
    image: couchdb:3.5.1
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=admin
    volumes:
      - couchdb3-data:/opt/couchdb/data
      - ./config/couchdb/local.ini:/opt/couchdb/etc/local.d/local.ini
    restart: always

  redis:
    networks:
      tercen:
        aliases:
          - redis
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "admin", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "admin", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always

  scheduler:
    networks:
      tercen:
        aliases:
          - scheduler
    image: tercen/ha-scheduler:0.34.8
    # the image's built-in healthcheck uses pgrep, which the image lacks
    healthcheck:
      disable: true
    environment:
      - RUST_LOG=info,sci_ha_scheduler_rust=info
      - REDIS_SENTINELS=redis:6379
      - REDIS_SERVICE_NAME=redis
      - REDIS_PASSWORD=admin
      - GRPC_PORT=50051
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  tercen:
    networks:
      tercen:
        ipv4_address: 172.42.0.42
        aliases:
          - tercen
    image: tercen/tercen:1.0.14
    privileged: true
    depends_on:
      postgres:
        condition: service_healthy
      couchdb:
        condition: service_started
      redis:
        condition: service_started
      scheduler:
        condition: service_started
    ports:
      - "5402:5400"
    environment:
      - TERCEN_PUBLIC_URI=http://127.0.0.1:5402
      - TERCEN_ADMIN_PASSWORD=admin
      - TERCEN_DB_BACKEND=postgres
      - tercen.pg.host=postgres
      - tercen.pg.port=5432
      - tercen.pg.database=tercen
      - tercen.pg.user=tercen
      - tercen.pg.password=tercen
      - tercen.pg.pool.size=10
      - tercen.blob.cache.enabled=true
      - TERCEN_COUCHDB_ADDRESS=couchdb
      - TERCEN_COUCHDB_USER=admin
      - TERCEN_COUCHDB_PASSWORD=admin
      - TERCEN_REDIS_HOST=redis
      - TERCEN_REDIS_PORT=6379
      - TERCEN_REDIS_PASSWORD=admin
      - TERCEN_SCHEDULER_HOST=scheduler
      - TERCEN_SCHEDULER_PORT=50051
      - TERCEN_SARNO_IMAGE=docker.io/tercen/sarno:v1.0.0-blobcache-dev6
      - tercen.podman.has.additional.image.store=false
      - tercen.docker.socket=/run/podman/podman.sock
      - TERCEN_WORKER_MEMORY_RESERVATION=250000000
      # GitHub token for installing operators from private repositories
      # (classic PAT with repo scope). Export it before docker compose up.
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - REGISTRY_AUTH_FILE=/root/.config/containers/auth.json
      - tercen.gcs.mock=true
      - tercen.gcs.bucket=studio-bucket
      - tercen.gcs.mock.dir=/var/lib/tercen/data/mock-gcs
    volumes:
      - ./config/tercen:/etc/tercen
      - tercen-data:/var/lib/tercen/data
      - tercen-podman-share:/home/podman/.local/share/containers
    entrypoint: ["sh", "-c", "mkdir -p /root/.config/containers && chmod 755 /root /root/.config /root/.config/containers; exec /usr/local/bin/podman-init.sh \"$@\"", "--"]
    command: ["sh", "-c", "CONTAINER_HOST=unix:///run/podman/podman.sock podman rm -f sarno >/dev/null 2>&1 || true; exec /app/bin/tercen"]
    restart: always

  tercen-worker:
    networks:
      tercen:
        ipv4_address: 172.42.0.43
        aliases:
          - tercen-worker
    image: tercen/tercen:1.0.14
    privileged: true
    depends_on:
      - tercen
    environment:
      # worker mode (dotted names are real config keys, same as production)
      - TERCEN_PUBLIC_URI=http://127.0.0.1:5402
      - TERCEN_SARNO_IMAGE=docker.io/tercen/sarno:v1.0.0-blobcache-dev6
      - tercen.is.worker=true
      - tercen.worker.name=worker-8
      - tercen.worker.deployment=worker-8
      - tercen.worker.ip=172.42.0.43
      - tercen.worker.cpu=4
      - tercen.podman.has.additional.image.store=false
      - tercen.docker.socket=/run/podman/podman.sock
      - tercen.worker.isolates=4
      - tercen.main.host=tercen
      - TERCEN_REDIS_HOST=redis
      - TERCEN_REDIS_PORT=6379
      - TERCEN_REDIS_PASSWORD=admin
      - TERCEN_DB_BACKEND=postgres
      - tercen.pg.host=postgres
      - tercen.pg.port=5432
      - tercen.pg.database=tercen
      - tercen.pg.user=tercen
      - tercen.pg.password=tercen
      - tercen.pg.pool.size=10
      - tercen.blob.cache.enabled=true
      - TERCEN_COUCHDB_ADDRESS=couchdb
      - TERCEN_COUCHDB_USER=admin
      - TERCEN_COUCHDB_PASSWORD=admin
      - TERCEN_SCHEDULER_HOST=scheduler
      - TERCEN_SCHEDULER_PORT=50051
      - TERCEN_WORKER_MEMORY_RESERVATION=250000000
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - REGISTRY_AUTH_FILE=/root/.config/containers/auth.json
      - tercen.gcs.mock=true
      - tercen.gcs.bucket=studio-bucket
      - tercen.gcs.mock.dir=/var/lib/tercen/data/mock-gcs
    volumes:
      - ./config/tercen:/etc/tercen
      - tercen-data:/var/lib/tercen/data
      - worker-podman-share:/home/podman/.local/share/containers
    entrypoint: ["sh", "-c", "mkdir -p /root/.config/containers && chmod 755 /root /root/.config /root/.config/containers; exec /usr/local/bin/podman-init.sh \"$@\"", "--"]
    command: ["sh", "-c", "CONTAINER_HOST=unix:///run/podman/podman.sock podman rm -f sarno >/dev/null 2>&1 || true; exec /app/bin/tercen"]
    restart: always

  tercen-studio:
    networks:
      tercen:
        aliases:
          - tercen-studio
    image: tercen/tercen-studio-r44:4.4.3-7
    ports:
      - "8787:8787"
    environment:
      - PASSWORD=tercen
    volumes:
      - tercen-studio-renv:/home/rstudio/.local/share/renv
      - tercen-studio-data:/home/rstudio/projects
      - ./config/tercen-studio/.Rprofile:/home/rstudio/.Rprofile
      - ./config/tercen-studio/examples:/home/rstudio/projects/examples
# uncomment to share host ssh and git config with tercen-studio
#      - ~/.ssh:/home/rstudio/.ssh
#      - ~/.gitconfig:/home/rstudio/.gitconfig
    restart: always

  code-server:
    profiles: ["python"]
    image: tercen/tercen-code-py39:3.9.17-2
    container_name: code-server
    environment:
      - PUID=1001
      - PGID=1001
      - PASSWORD=tercen
      - SUDO_PASSWORD=tercen
    volumes:
      - code-server-data:/config
    networks:
      tercen:
        aliases:
          - code-server
    ports:
      - "8443:8443"
    restart: unless-stopped

volumes:
  postgres-data:
  couchdb3-data:
  redis-data:
  code-server-data:
  tercen-data:
  tercen-studio-data:
  tercen-studio-renv:
  tercen-podman-share:
  worker-podman-share:
